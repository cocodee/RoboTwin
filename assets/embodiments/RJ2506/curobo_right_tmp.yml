robot_cfg:
  kinematics:
    urdf_path: ${ASSETS_PATH}/assets/embodiments/RJ2506/urdf/relpath_RJ2506_compact.urdf
    base_link: "base_link"
    ee_link: "right_hand_tcp"
    collision_link_names:
      ["base_link", "body_link1", "body_link2", "right_arm_link0", "right_arm_link1", "right_arm_link2", "right_arm_link3", "right_arm_link4", "right_hand_base"]
    collision_spheres: ${ASSETS_PATH}/assets/embodiments/RJ2506/collision.yml
    collision_sphere_buffer: 0.004
    self_collision_ignore: {"body_link1": ["body_link2"]}
    self_collision_buffer: {}
    mesh_link_names:
      ["base_link", "body_link1", "body_link2", "right_arm_link0", "right_arm_link1", "right_arm_link2", "right_arm_link3", "right_arm_link4", "right_hand_base"]
    cspace:
      joint_names: ["right_arm_joint0", "right_arm_joint1", "right_arm_joint2", "right_arm_joint3", "right_arm_joint4", "right_arm_joint5"]
      retract_config: [0.0, 1.0, 0.0, 0.8, 0.0, 0.0]
      null_space_weight: [1, 1, 1, 1, 1, 1]
      cspace_distance_weight: [1, 1, 1, 1, 1, 1]
      max_acceleration: 15.0
      max_jerk: 500.0
planner:
  frame_bias: [0.0, 0.0, 0.0]
  skip_warmup: true
  graph_only: true
  max_attempts: 5
  timeout: 5.0
  # Tabletop in world coordinates; transformed into each arm planner frame.
  table:
    dims: [1.2, 0.7, 0.05]
    pose: [0.0, 0.0, 0.715, 1.0, 0.0, 0.0, 0.0]
