name: robotwin-qwen38-27b

services:
  model:
    image: ${VLLM_IMAGE:-vllm/vllm-omni:cosmos3}
    container_name: robotwin-qwen38
    restart: unless-stopped
    network_mode: host
    entrypoint: [python, -m, vllm.entrypoints.openai.api_server]
    command:
      - --model
      - Qwen/Qwen3.8-27B
      - --revision
      - 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
      - --served-model-name
      - qwen3.8-27b
      - --host
      - 127.0.0.1
      - --port
      - "${MODEL_PORT:-18083}"
      - --dtype
      - bfloat16
      - --max-model-len
      - "${MODEL_MAX_LEN:-65536}"
      - --max-num-seqs
      - "2"
      - --max-num-batched-tokens
      - "8192"
      - --gpu-memory-utilization
      - "0.90"
      - --enforce-eager
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      - --limit-mm-per-prompt
      - '{"image":6,"video":0}'
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_HUB_DISABLE_XET: "0"
      HF_XET_HIGH_PERFORMANCE: "1"
      HF_HUB_OFFLINE: "${MODEL_OFFLINE:-0}"
      OMP_NUM_THREADS: "8"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,::1
    volumes:
      - ${MODEL_CACHE_DIR:-../../../model-cache/huggingface}:/cache/huggingface
    shm_size: 16gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${MODEL_GPU_UUID:-7}"]
              capabilities: [gpu]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${MODEL_PORT:-18083}/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30m
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
